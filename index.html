<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>SpendZ</title>
    <link rel="icon" type="image/png" href="exp.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        /* ===================== THEMES ===================== */
        :root, html[data-theme="green"] {
            --accent: #7c9d56;
            --accent-dark: #6a8c4c;
            --on-accent: #ffffff;
            --app-bg: #f4f4f9;
            --panel: #f1f7f4;
            --card: #ffffff;
            --text: #333333;
            --text-soft: #666666;
            --muted: #9aa39c;
            --border: #eeeeee;
            --line: #dfe8e2;
            --input-border: #dddddd;
            --press: #f2f2f2;
            --hover-soft: #e9efe9;
            --dash-hover: #eef4ea;
            --chev: #c2c9c4;
            --grip: #cdd4ce;
            --cancel: #c7cdc9;
            --cancel-hover: #b8beba;
            --red: #ff6f61;
            --red-dark: #e65c4b;
            --orange: #ffa500;
            --orange-dark: #e68900;
            --shadow-1: rgba(0, 0, 0, .08);
            --shadow-2: rgba(0, 0, 0, .18);
            --backdrop: rgba(0, 0, 0, .4);
            color-scheme: light;
        }

        html[data-theme="brown"] {
            --accent: #8b5e3c;
            --accent-dark: #734a2e;
            --on-accent: #ffffff;
            --app-bg: #faf6f2;
            --panel: #f7f1ea;
            --card: #ffffff;
            --text: #3a2f28;
            --text-soft: #6b5a4e;
            --muted: #a89385;
            --border: #f0e7de;
            --line: #e8dbcd;
            --input-border: #e2d5c8;
            --press: #f5ede5;
            --hover-soft: #f0e6db;
            --dash-hover: #f6eee5;
            --chev: #cbb8a8;
            --grip: #d8c8b9;
            --cancel: #d6c7b8;
            --cancel-hover: #c7b5a3;
            --red: #d4634f;
            --red-dark: #bb5241;
            --orange: #d98a2b;
            --orange-dark: #bd7520;
            --shadow-1: rgba(80, 50, 30, .10);
            --shadow-2: rgba(80, 50, 30, .20);
            --backdrop: rgba(45, 30, 20, .45);
            color-scheme: light;
        }

        html[data-theme="dark"] {
            --accent: #d9bb92;
            --accent-dark: #e7cfae;
            --on-accent: #241a11;
            --app-bg: #100e0c;
            --panel: #191614;
            --card: #221e1b;
            --text: #ece5dc;
            --text-soft: #c0b5a8;
            --muted: #8d8176;
            --border: #2f2a26;
            --line: #2f2a26;
            --input-border: #3a332d;
            --press: #2b2521;
            --hover-soft: #2b2521;
            --dash-hover: #2a231d;
            --chev: #8d8176;
            --grip: #6b625a;
            --cancel: #3a332d;
            --cancel-hover: #463d35;
            --red: #e4836f;
            --red-dark: #cc6f5c;
            --orange: #d7a05f;
            --orange-dark: #c08c4b;
            --shadow-1: rgba(0, 0, 0, .45);
            --shadow-2: rgba(0, 0, 0, .55);
            --backdrop: rgba(0, 0, 0, .6);
            color-scheme: dark;
        }

        html, body { height: 100%; }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--app-bg);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 10px 0;
            overflow: hidden;
        }

        .app-container {
            position: relative;
            background-color: var(--panel);
            border-radius: 12px;
            box-shadow: 0 4px 10px var(--shadow-1);
            width: 90%;
            max-width: 400px;
            height: calc(100vh - 20px);
            height: calc(100dvh - 20px);
            overflow: hidden;
        }

        /* ---------- Sliding views ---------- */
        .view {
            position: absolute;
            inset: 0;
            padding: 20px;
            padding-bottom: calc(20px + env(safe-area-inset-bottom));
            display: flex;
            flex-direction: column;
            min-height: 0;
            background-color: var(--panel);
            transition: transform .38s cubic-bezier(.32, .72, 0, 1);
            will-change: transform;
        }
        .app-container.show-home   #homeView   { transform: translateX(0); }
        .app-container.show-home   #detailView { transform: translateX(100%); }
        .app-container.show-detail #homeView   { transform: translateX(-25%); }
        .app-container.show-detail #detailView { transform: translateX(0); }

        button { transition: transform .12s ease, background-color .2s ease; }
        button:active { transform: scale(.95); }

        /* ---------- Home page ---------- */
        .home-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
            flex-shrink: 0;
        }
        .app-title { color: var(--accent); margin: 0; }

        .menu-btn {
            background-color: var(--accent);
            color: var(--on-accent);
            border: none;
            width: 40px; height: 40px;
            border-radius: 10px;
            font-size: 22px; line-height: 1;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .menu-btn:hover { background-color: var(--accent-dark); }

        .menu-backdrop { position: fixed; inset: 0; z-index: 15; display: none; }
        .menu-backdrop.open { display: block; }

        .home-menu {
            position: absolute;
            top: 66px; right: 20px;
            min-width: 190px;
            background: var(--card);
            border-radius: 12px;
            box-shadow: 0 8px 24px var(--shadow-2);
            overflow: hidden;
            z-index: 20;
            opacity: 0;
            transform: translateY(-8px) scale(.98);
            transform-origin: top right;
            pointer-events: none;
            transition: opacity .18s ease, transform .18s ease;
        }
        .home-menu.open { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }
        .home-menu button {
            width: 100%; text-align: left;
            padding: 14px 16px; border: none; background: var(--card);
            font-size: 15px; cursor: pointer; color: var(--text);
            display: flex; align-items: center; gap: 10px;
        }
        .home-menu button:not(:last-child) { border-bottom: 1px solid var(--border); }
        .home-menu button:active { background: var(--press); }
        .home-menu .menu-icon { font-size: 16px; width: 18px; text-align: center; }
        .home-menu .danger { color: var(--red); }

        /* ---------- Rows (home + detail share look) ---------- */
        .rows-container {
            position: relative;
            flex: 1 1 auto;
            min-height: 0;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-right: 2px;
            overscroll-behavior: contain;
        }
        .home-rows { margin-bottom: 15px; gap: 6px; }
        .home-rows .row { padding: 10px 8px 10px 12px; }

        .row {
            background-color: var(--card);
            padding: 12px 10px 12px 14px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 2px 5px var(--shadow-1);
        }
        .row.folder { cursor: pointer; }
        .row.folder:active { transform: scale(.985); }
        .row.dragging { opacity: .97; box-shadow: 0 12px 26px var(--shadow-2); }
        .drop-indicator {
            position: absolute; left: 0; right: 0; height: 3px;
            background: var(--accent); border-radius: 2px;
            pointer-events: none; z-index: 5; display: none;
        }

        .row-name { flex-grow: 1; text-align: left; color: var(--text); font-weight: bold; }
        .row.product .row-name { font-weight: normal; }
        .row-amount { color: var(--accent); font-weight: bold; white-space: nowrap; }
        .row.product .row-amount { color: var(--text); font-weight: normal; }
        /* the one arrow next to the amount: opens the Marked / Total picker */
        .chevron {
            color: var(--chev); font-size: 18px; line-height: 1; margin-left: 2px;
            background: transparent; border: none; padding: 0 2px;
            width: 20px; height: 24px; border-radius: 5px; cursor: pointer;
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        }
        .chevron:hover { background: var(--hover-soft); color: var(--accent); }

        /* amount + mode picker */
        .amt-wrap { display: flex; align-items: center; gap: 2px; flex-shrink: 0; }
        .amt-wrap.marked-mode .row-amount::before {
            content: '\2713'; font-size: .78em; margin-right: 3px; opacity: .85;
        }

        /* one popup menu, anchored under whatever button opened it */
        .pop-menu {
            position: fixed; z-index: 60; min-width: 170px;
            background: var(--card); border-radius: 12px;
            box-shadow: 0 8px 24px var(--shadow-2);
            overflow: hidden; display: none;
            opacity: 0; transform: translateY(-6px) scale(.98);
            transform-origin: top right;
            transition: opacity .16s ease, transform .16s ease;
        }
        .pop-menu.open { display: block; opacity: 1; transform: none; }
        .pop-menu button {
            width: 100%; text-align: left; padding: 12px 14px; border: none;
            background: var(--card); font-size: 14px; color: var(--text);
            cursor: pointer; display: flex; align-items: center; gap: 8px;
        }
        .pop-menu button:not(:last-child) { border-bottom: 1px solid var(--border); }
        .pop-menu button:active { background: var(--press); }
        .pop-menu button.danger { color: var(--red); }
        .pop-menu .tick { width: 13px; color: var(--accent); font-weight: bold; }
        .pop-title {
            padding: 10px 14px; font-size: .78em; color: var(--muted);
            border-bottom: 1px solid var(--border);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 230px;
        }

        /* multi-select */
        .row.selected {
            background: var(--dash-hover);
            box-shadow: inset 0 0 0 2px var(--accent), 0 2px 5px var(--shadow-1);
        }
        .row.drag-mate { opacity: .45; }

        /* date image before an item name */
        .date-img {
            width: 1.55em; height: 1.55em; border-radius: 5px;
            object-fit: cover; flex-shrink: 0; display: block;
        }
        .date-chip {
            flex-shrink: 0; font-size: .68em; color: var(--muted);
            border: 1px solid var(--border); border-radius: 5px; padding: 2px 4px;
            white-space: nowrap;
        }

        .dot-btn {
            flex-shrink: 0;
            background: transparent;
            border: none;
            color: var(--muted);
            font-size: 20px; line-height: 1;
            width: 30px; height: 30px;
            border-radius: 6px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .dot-btn:hover { background: var(--hover-soft); color: var(--text); }

        .grip {
            flex-shrink: 0; cursor: move; color: var(--grip);
            font-size: 16px; line-height: 1; padding-right: 2px;
        }
        .checkbox { flex-shrink: 0; transform: scale(1.15); margin: 0 4px 0 0; accent-color: var(--accent); }

        .empty-msg { color: var(--muted); margin: 20px 0; text-align: center; }

        .home-footer { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
        .add-list-btn {
            background-color: var(--accent);
            color: var(--on-accent); border: none;
            padding: 14px; flex: 1 1 auto;
            border-radius: 10px; cursor: pointer;
            font-size: 16px;
        }
        .add-list-btn:hover { background-color: var(--accent-dark); }
        .home-total, .home-totals {
            display: flex; flex-direction: column; align-items: flex-end;
            line-height: 1.15; white-space: nowrap; flex-shrink: 0;
        }
        .ht-block { display: flex; align-items: baseline; gap: 5px; }
        .ht-label { font-size: .62em; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }
        .ht-amount { font-size: 1.0em; font-weight: bold; color: var(--accent); }

        .row.is-hidden { opacity: .5; }

        /* ---------- Detail page ---------- */
        .header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; flex-shrink: 0; }
        .back-btn {
            background-color: var(--accent); color: var(--on-accent); border: none;
            padding: 8px 12px; border-radius: 8px; cursor: pointer;
            display: flex; align-items: center; gap: 6px; font-size: 14px; flex-shrink: 0;
        }
        .back-btn:hover { background-color: var(--accent-dark); }
        .back-btn .arrow { font-size: 1.15em; line-height: 1; }

        .detail-title {
            flex: 1 1 auto; min-width: 0;
            text-align: center; color: var(--accent);
            font-weight: bold; font-size: 1.1em;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .detail-menu-btn { width: 38px; height: 38px; border-radius: 8px; flex-shrink: 0; }

        .breadcrumb {
            font-size: .8em; color: var(--muted); margin-bottom: 3px;
            display: flex; flex-wrap: wrap; align-items: center; gap: 3px; flex-shrink: 0;
        }
        .breadcrumb .crumb { cursor: pointer; color: var(--accent); }
        .breadcrumb .sep { color: var(--chev); }

        .current-list-name {
            color: var(--accent); font-size: 1.4em; font-weight: bold;
            text-align: left; margin-bottom: 12px; flex-shrink: 0;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        .expense-form {
            display: flex; gap: 10px; margin-bottom: 10px;
            align-items: center; flex-shrink: 0; position: relative;
        }
        .expense-form input {
            padding: 10px; border: 2px solid var(--input-border); border-radius: 8px;
            font-size: 16px; background: var(--card); color: var(--text);
        }
        .expense-form input::placeholder { color: var(--muted); }
        .title-wrap { position: relative; width: 40%; }
        .title-wrap input { width: 100%; padding-right: 36px; }
        .amount-wrap { position: relative; width: 40%; }
        .amount-wrap input { width: 100%; padding-right: 38px; }

        .cal-btn {
            position: absolute; right: 5px; top: 50%; transform: translateY(-50%);
            width: 28px; height: 28px; padding: 0; border: none; border-radius: 6px;
            background: transparent; color: var(--muted); font-size: 17px; line-height: 1;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            overflow: hidden;
        }
        .cal-btn:hover { background: var(--hover-soft); }
        .cal-btn:active { transform: translateY(-50%) scale(.88); }
        .cal-btn.has-date { background: var(--accent); color: var(--on-accent); font-size: 13px; font-weight: bold; }
        .cal-btn img { width: 100%; height: 100%; object-fit: cover; display: block; }

        .cal-pop {
            position: absolute; z-index: 45; top: calc(100% + 8px); left: 0;
            width: 258px; max-width: 100%;
            background: var(--card); border-radius: 12px;
            box-shadow: 0 8px 26px var(--shadow-2);
            padding: 10px; display: none;
        }
        .cal-pop.open { display: block; }
        .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
        .cal-head button {
            border: none; background: transparent; color: var(--accent);
            font-size: 20px; line-height: 1; width: 30px; height: 30px;
            border-radius: 8px; cursor: pointer;
        }
        .cal-head button:hover { background: var(--hover-soft); }
        .cal-label { font-weight: bold; color: var(--text); font-size: 14px; }
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
        .cal-dow { text-align: center; font-size: 10px; color: var(--muted); padding: 3px 0; }
        .cal-day {
            border: none; background: transparent; color: var(--text);
            font-size: 13px; height: 30px; border-radius: 8px; cursor: pointer; padding: 0;
        }
        .cal-day:hover { background: var(--hover-soft); }
        .cal-day.blank { visibility: hidden; pointer-events: none; }
        .cal-day.today { box-shadow: inset 0 0 0 1.5px var(--accent); }
        .cal-day.sel { background: var(--accent); color: var(--on-accent); font-weight: bold; }
        .cal-foot { display: flex; gap: 8px; margin-top: 8px; }
        .cal-foot button {
            flex: 1; padding: 8px; border: none; border-radius: 8px;
            background: var(--press); color: var(--text); font-size: 13px; cursor: pointer;
        }
        .cal-foot button:hover { background: var(--hover-soft); }

        .op-btn {
            position: absolute; right: 5px; top: 50%; transform: translateY(-50%);
            width: 28px; height: 28px; padding: 0; border: none; border-radius: 6px;
            background-color: var(--orange); color: #fff; font-size: 20px; line-height: 1;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            overflow: hidden;
        }
        .op-btn:hover { background-color: var(--orange-dark); }
        .op-btn:active { transform: translateY(-50%) scale(.88); }
        .op-icon { width: 100%; height: 100%; object-fit: cover; display: block; }

        .op-menu {
            position: absolute; right: 0; top: calc(100% + 6px);
            min-width: 155px;
            background: var(--card); border-radius: 10px;
            box-shadow: 0 8px 24px var(--shadow-2);
            overflow: hidden; z-index: 40;
            opacity: 0; transform: translateY(-6px) scale(.98);
            transform-origin: top right; pointer-events: none;
            transition: opacity .16s ease, transform .16s ease;
        }
        .op-menu.open { opacity: 1; transform: none; pointer-events: auto; }
        .op-menu button {
            width: 100%; text-align: left; padding: 11px 14px; border: none; background: var(--card);
            font-size: 15px; cursor: pointer; color: var(--text);
            display: flex; align-items: center; gap: 12px;
        }
        .op-menu button:not(:last-child) { border-bottom: 1px solid var(--border); }
        .op-menu button:active { background: var(--press); }
        .op-menu .op-sym { font-size: 19px; width: 20px; text-align: center; color: var(--accent); font-weight: bold; }
        .add-btn {
            background-color: var(--accent); color: var(--on-accent); border: none;
            padding: 10px 15px; border-radius: 8px; cursor: pointer; font-size: 15px;
        }
        .add-btn:hover { background-color: var(--accent-dark); }

        .add-sublist-btn {
            background: var(--card); color: var(--accent); border: 2px dashed var(--accent);
            padding: 9px; width: 100%; border-radius: 8px; cursor: pointer;
            font-size: 14px; margin-bottom: 12px; flex-shrink: 0;
        }
        .add-sublist-btn:hover { background: var(--dash-hover); }

        @keyframes slideUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
        .rows-container.anim { animation: slideUp .22s ease; }

        .total-amount-container {
            display: flex; justify-content: space-between; align-items: center;
            padding-top: 14px; margin-top: 10px;
            border-top: 1px solid var(--line); flex-shrink: 0;
        }
        .total-amount h2, .total-amount-large h2 { font-size: 0.95em; color: var(--accent); }
        .total-amount { text-align: left; }
        .total-amount-large { text-align: right; }

        /* ---------- Dialogs ---------- */
        .overlay {
            position: fixed; inset: 0; background: var(--backdrop);
            display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: opacity .25s ease; z-index: 50;
        }
        .overlay.open { opacity: 1; pointer-events: auto; }
        .dialog {
            background: var(--card); width: 84%; max-width: 330px; border-radius: 16px;
            padding: 22px 20px 16px; text-align: center;
            transform: scale(.85); opacity: 0;
            transition: transform .28s cubic-bezier(.32,.72,0,1), opacity .28s ease;
        }
        .overlay.open .dialog { transform: scale(1); opacity: 1; }
        .dialog h3 { color: var(--text); margin-bottom: 8px; font-size: 1.15em; }
        .dialog p { color: var(--text-soft); font-size: .92em; margin-bottom: 16px; line-height: 1.4; }
        .dialog input {
            width: 100%; padding: 11px; border: 2px solid var(--input-border);
            border-radius: 8px; font-size: 16px; margin-bottom: 16px;
            background: var(--card); color: var(--text);
        }
        .dialog-buttons { display: flex; gap: 10px; }
        .dialog-buttons button {
            flex: 1; padding: 11px; border: none; border-radius: 8px;
            cursor: pointer; font-size: 15px; color: var(--on-accent);
        }
        .btn-cancel { background: var(--cancel); color: var(--text) !important; }
        .btn-cancel:hover { background: var(--cancel-hover); }
        .btn-ok { background: var(--accent); }
        .btn-ok:hover { background: var(--accent-dark); }
        .btn-danger { background: var(--red); color: #fff; }
        .btn-danger:hover { background: var(--red-dark); }

        .move-list {
            max-height: 42vh; overflow-y: auto; text-align: left;
            margin-bottom: 14px; border: 1px solid var(--border); border-radius: 8px;
        }
        .move-list button {
            width: 100%; text-align: left; padding: 12px 12px; border: none;
            border-bottom: 1px solid var(--border); background: var(--card); cursor: pointer;
            font-size: 14px; color: var(--text); display: flex; align-items: center; gap: 6px;
        }
        .move-list button:last-child { border-bottom: none; }
        .move-list button:hover { background: var(--press); }
        .move-list .mv-icon { color: var(--accent); }

        /* ---------- Action sheet ---------- */
        .sheet {
            position: absolute; left: 12px; right: 12px; bottom: 12px;
            display: flex; flex-direction: column; gap: 8px;
            transform: translateY(120%);
            transition: transform .35s cubic-bezier(.32,.72,0,1);
        }
        .overlay.open .sheet { transform: translateY(0); }
        .sheet-group { background: var(--card); border-radius: 14px; overflow: hidden; }
        .sheet-title { padding: 14px; color: var(--muted); font-size: .85em; border-bottom: 1px solid var(--border); }
        .sheet-btn {
            width: 100%; padding: 15px; border: none; background: var(--card);
            font-size: 16px; cursor: pointer; color: var(--accent);
        }
        .sheet-btn:not(:last-child) { border-bottom: 1px solid var(--border); }
        .sheet-btn.danger { color: var(--red); }
        .sheet-btn:active { background: var(--press); }
        .sheet-cancel {
            width: 100%; padding: 15px; border: none; background: var(--card);
            border-radius: 14px; font-size: 16px; font-weight: bold; cursor: pointer; color: var(--text);
        }
    </style>
</head>
<body>

    <div class="app-container show-home" id="appContainer">

        <!-- ============ HOME ============ -->
        <div id="homeView" class="view">
            <div class="menu-backdrop" id="menuBackdrop" onclick="closeHomeMenu()"></div>

            <div class="home-header">
                <h1 class="app-title">SpendZ</h1>
                <button class="menu-btn" onclick="toggleHomeMenu(event)" title="Options">&#8942;</button>
            </div>

            <div class="home-menu" id="homeMenu">
                <button onclick="triggerImport()"><span class="menu-icon">&#8595;</span> Import CSV</button>
                <button onclick="exportCSV()"><span class="menu-icon">&#8593;</span> Export CSV</button>
                <button onclick="openThemeMenu()"><span class="menu-icon">&#9680;</span> Theme</button>
                <button onclick="toggleShowHidden()"><span class="menu-icon">&#128065;</span> <span id="toggleHiddenLabel">Show hidden lists</span></button>
                <button class="danger" onclick="clearAllLists()"><span class="menu-icon">&#128465;</span> Clear All Lists</button>
            </div>

            <input type="file" id="importFile" accept=".csv,text/csv" style="display:none" onchange="handleImportFile(event)" />

            <div class="rows-container home-rows" id="homeRows"></div>
            <div class="home-footer">
                <button class="add-list-btn" onclick="addTopList()">+ Add New List</button>
                <div class="home-totals">
                    <div class="ht-block"><span class="ht-label">Marked</span><span class="ht-amount">&#8377;<span id="homeMarkedAmount">0</span></span></div>
                    <div class="ht-block"><span class="ht-label">Total</span><span class="ht-amount">&#8377;<span id="homeTotalAmount">0</span></span></div>
                </div>
            </div>
        </div>

        <!-- ============ DETAIL (a list's contents) ============ -->
        <div id="detailView" class="view">
            <div class="header">
                <button class="back-btn" onclick="goBack()"><span class="arrow">&#8592;</span> Back</button>
                <span class="detail-title" id="currentListName"></span>
                <button class="menu-btn detail-menu-btn" onclick="openDetailMenu(event)" title="Options">&#8942;</button>
            </div>

            <div class="breadcrumb" id="breadcrumb"></div>

            <div class="expense-form">
                <div class="title-wrap">
                    <input type="text" id="expenseTitle" placeholder="Item" />
                    <button type="button" class="cal-btn" id="calBtn" onclick="toggleCalendar(event)" title="Pick a date">&#128197;</button>
                </div>
                <div class="amount-wrap">
                    <input type="number" inputmode="decimal" pattern="[0-9]*" id="expenseAmount" placeholder="Price" />
                    <button type="button" class="op-btn" id="opBtn" onclick="toggleOpMenu(event)" title="Choose operation"><img src="ASMD.png" alt="operations" class="op-icon" /></button>
                    <div class="op-menu" id="opMenu">
                        <button type="button" onclick="applyOp('+')"><span class="op-sym">+</span> Add</button>
                        <button type="button" onclick="applyOp('-')"><span class="op-sym">&minus;</span> Subtract</button>
                        <button type="button" onclick="applyOp('*')"><span class="op-sym">&times;</span> Multiply</button>
                        <button type="button" onclick="applyOp('/')"><span class="op-sym">&divide;</span> Divide</button>
                    </div>
                </div>
                <button class="add-btn" onclick="addProduct()">Add</button>

                <div class="cal-pop" id="calPop">
                    <div class="cal-head">
                        <button type="button" onclick="calShift(-1)" title="Previous month">&#8249;</button>
                        <span class="cal-label" id="calLabel"></span>
                        <button type="button" onclick="calShift(1)" title="Next month">&#8250;</button>
                    </div>
                    <div class="cal-grid" id="calGrid"></div>
                    <div class="cal-foot">
                        <button type="button" onclick="calPick(null)">No date</button>
                        <button type="button" onclick="calToday()">Today</button>
                    </div>
                </div>
            </div>

            <div class="rows-container" id="detailRows"></div>

            <div class="total-amount-container">
                <div class="total-amount"><h2>Marked: &#8377; <span id="totalMarkedAmount">0</span></h2></div>
                <div class="total-amount-large"><h2>Total: &#8377; <span id="totalAmount">0</span></h2></div>
            </div>
        </div>

    </div>

    <div class="pop-menu" id="popMenu"></div>
    <div class="overlay" id="dialogOverlay"><div class="dialog" id="dialogBox"></div></div>
    <div class="overlay" id="sheetOverlay"><div class="sheet" id="sheetBox"></div></div>

    <script>
        /* ============================================================
           DATA MODEL
           A single tree stored under 'spendzTree'.
           node = { id, name, type:'list'|'product', amount, checked, children:[] }
           displayed amount: product -> amount; list -> sum of children.
           ============================================================ */
        let tree = null;             // root { children:[...] } (root has no name/id)
        let currentPath = [];        // ids from root to the node currently open
        let acc = null;              // running value for the operator picker
        let pendingOp = null;        // operation to apply next ('+','-','*','/')
        let dnd = null;              // active drag state (custom touch/mouse reorder)
        let showHidden = false;      // reveal hidden lists (resets each load)
        let pendingDate = null;      // date chosen in the form ('YYYY-MM-DD') or null
        let calCursor = null;        // month currently shown in the calendar popup
        let sel = null;              // multi-select: { kind:'product'|'list', parentKey, ids:[] }
        let suppressTap = false;     // swallow the click that follows a long-press

        const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

        function getTree() {
            try { return JSON.parse(localStorage.getItem('spendzTree')) || { children: [] }; }
            catch (_) { return { children: [] }; }
        }
        function saveTree() { localStorage.setItem('spendzTree', JSON.stringify(tree)); }

        function migrateIfNeeded() {
            if (localStorage.getItem('spendzTree')) return;
            const oldLists = JSON.parse(localStorage.getItem('expenseLists') || 'null');
            const root = { children: [] };
            if (oldLists) {
                oldLists.forEach(name => {
                    const items = JSON.parse(localStorage.getItem('expenses_' + name) || '[]');
                    const listNode = { id: uid(), name, type: 'list', checked: false, amount: 0, children: [] };
                    items.forEach(it => listNode.children.push({
                        id: uid(), name: it.title, type: 'product',
                        amount: it.amount, checked: !!it.checked, children: []
                    }));
                    root.children.push(listNode);
                });
            }
            localStorage.setItem('spendzTree', JSON.stringify(root));
        }

        function getNodeByPath(path) {
            let node = tree;
            for (const id of path) {
                node = (node.children || []).find(c => c.id === id);
                if (!node) return null;
            }
            return node;
        }
        function nodeTotal(node) {
            if (node.type === 'product') return node.amount || 0;
            return (node.children || []).reduce((s, c) => s + (c.hidden ? 0 : nodeTotal(c)), 0);
        }

        /* The amount a node contributes upward.
           A list set to 'marked' counts only its marked children; 'total' counts them all.
           Each child is counted through nodeValue, so a child's own choice is respected too. */
        function amountMode(node) { return node.amountMode === 'marked' ? 'marked' : 'total'; }

        function nodeValue(node) {
            if (node.type === 'product') return node.amount || 0;
            const onlyMarked = amountMode(node) === 'marked';
            return (node.children || []).reduce((sum, c) => {
                if (c.hidden) return sum;
                if (onlyMarked && !c.checked) return sum;
                return sum + nodeValue(c);
            }, 0);
        }
        function formatAmount(n) { return Number.isInteger(n) ? String(n) : n.toFixed(2); }

        /* ---------- Navigation ---------- */
        const appContainer = document.getElementById('appContainer');

        function render() {
            closePopMenu();
            if (currentPath.length === 0) {
                appContainer.classList.remove('show-detail');
                appContainer.classList.add('show-home');
                renderHome();
            } else {
                appContainer.classList.remove('show-home');
                appContainer.classList.add('show-detail');
                renderDetail();
            }
            pruneSelection();
        }
        function go(path) { sel = null; currentPath = path.slice(); clearProductForm(); render(); }
        function goBack() { go(currentPath.slice(0, -1)); }

        document.addEventListener('DOMContentLoaded', () => {
            applyTheme(localStorage.getItem('spendzTheme') || 'brown');
            migrateIfNeeded();
            tree = getTree();
            updateDateButton();
            render();
        });

        /* ---------- Home (full expanded tree) ---------- */
        function renderHome() {
            const box = document.getElementById('homeRows');
            box.innerHTML = '';
            if (tree.children.length === 0) {
                box.innerHTML = '<p class="empty-msg">No lists yet. Add one below!</p>';
            } else {
                (function walk(parent, parentPath, depth) {
                    parent.children.forEach((node, idx) => {
                        if (node.type !== 'list') return;         // outline shows lists & sub-lists only
                        if (node.hidden && !showHidden) return;   // skip hidden unless revealing
                        const path = parentPath.concat(node.id);
                        makeRow(box, node, path, idx, { detail: false, depth: depth, checkbox: depth === 1 });
                        if (node.children.length) walk(node, path, depth + 1);
                    });
                })(tree, [], 1);
                retriggerAnim(box);
            }
            let grand = 0, marked = 0;
            tree.children.forEach(n => {
                if (n.hidden) return;                 // hidden lists excluded from totals
                const amt = nodeValue(n);
                grand += amt;
                if (n.checked) marked += amt;
            });
            document.getElementById('homeTotalAmount').textContent = formatAmount(grand);
            document.getElementById('homeMarkedAmount').textContent = formatAmount(marked);
        }

        async function addTopList() {
            let name = await customPrompt('Name your new list:', 'New List');
            if (name === null) return;
            name = name.trim();
            if (!name) { await customAlert('Please enter a valid name.'); return; }
            tree.children.unshift({ id: uid(), name, type: 'list', checked: false, amount: 0, children: [] });
            saveTree();
            renderHome();
        }

        /* ---------- Detail ---------- */
        function renderDetail() {
            const node = getNodeByPath(currentPath);
            if (!node) { go([]); return; }

            // breadcrumb (ancestors, clickable)
            const bc = document.getElementById('breadcrumb');
            bc.innerHTML = '';
            const homeCrumb = document.createElement('span');
            homeCrumb.className = 'crumb';
            homeCrumb.textContent = 'Home';
            homeCrumb.onclick = () => go([]);
            bc.appendChild(homeCrumb);
            let acc = [];
            for (let i = 0; i < currentPath.length - 1; i++) {
                acc.push(currentPath[i]);
                const anc = getNodeByPath(acc);
                const sep = document.createElement('span'); sep.className = 'sep'; sep.textContent = '\u203A';
                bc.appendChild(sep);
                const c = document.createElement('span');
                c.className = 'crumb'; c.textContent = anc.name;
                const jump = acc.slice();
                c.onclick = () => go(jump);
                bc.appendChild(c);
            }

            document.getElementById('currentListName').textContent = node.name;

            const box = document.getElementById('detailRows');
            box.innerHTML = '';
            if (node.children.length === 0) {
                box.innerHTML = '<p class="empty-msg">Empty. Add a product or a sub-list above.</p>';
            } else {
                node.children.forEach((child, index) => {
                    if (child.type === 'list' && child.hidden && !showHidden) return;  // hidden everywhere
                    // direct child: flush left, checkbox + drag reorder
                    makeRow(box, child, currentPath.concat(child.id), index, { detail: true, depth: 1 });
                    // its own sub-lists shown indented beneath it (preview of the branch)
                    if (child.type === 'list') renderSubOutline(box, child, currentPath.concat(child.id), 2);
                });
            }
            retriggerAnim(box);

            let marked = 0, total = 0;
            node.children.forEach(c => {
                if (c.hidden) return;
                const amt = nodeValue(c);
                total += amt;
                if (c.checked) marked += amt;
            });
            document.getElementById('totalAmount').textContent = total.toFixed(0);
            document.getElementById('totalMarkedAmount').textContent = marked.toFixed(0);
        }

        // Build one row. opts.detail => checkbox + drag reorder. opts.depth => indent on the home tree.
        function makeRow(box, node, path, index, opts) {
            opts = opts || {};
            const detail = !!opts.detail;
            const depth = opts.depth || 0;
            const isList = node.type === 'list';

            const row = document.createElement('div');
            row.className = 'row ' + (isList ? 'folder' : 'product');
            if (node.hidden) row.classList.add('is-hidden');
            if (isSelected(node.id, path)) row.classList.add('selected');
            if (depth > 1) row.style.marginLeft = ((depth - 1) * 16) + 'px';
            const parentPath = path.slice(0, -1);
            row.dataset.id = node.id;
            row.dataset.parent = JSON.stringify(parentPath);
            attachDrag(row);

            if (detail || opts.checkbox) {
                const cb = document.createElement('input');
                cb.type = 'checkbox'; cb.className = 'checkbox'; cb.checked = !!node.checked;
                cb.onclick = (e) => { e.stopPropagation(); toggleCheck(path); };
                row.appendChild(cb);
            }

            // date badge from the AllDates folder, shown before the item name
            if (node.type === 'product' && node.date) {
                const img = document.createElement('img');
                img.className = 'date-img';
                img.src = 'AllDates/' + dateImageFile(node.date);
                img.alt = dateLabel(node.date);
                img.title = dateLabel(node.date);
                img.onerror = () => {                       // no image on disk -> small text badge
                    const chip = document.createElement('span');
                    chip.className = 'date-chip';
                    chip.textContent = dateLabel(node.date);
                    if (img.parentElement) img.parentElement.replaceChild(chip, img);
                };
                row.appendChild(img);
            }

            const name = document.createElement('span');
            name.className = 'row-name'; name.textContent = node.name;
            row.appendChild(name);

            const amtWrap = document.createElement('span');
            amtWrap.className = 'amt-wrap';
            const amt = document.createElement('span');
            amt.className = 'row-amount';
            amt.textContent = '\u20B9' + formatAmount(nodeValue(node));
            amtWrap.appendChild(amt);
            if (isList && amountMode(node) === 'marked') amtWrap.classList.add('marked-mode');
            row.appendChild(amtWrap);

            if (isList) {
                const chev = document.createElement('button');
                chev.type = 'button';
                chev.className = 'chevron';
                chev.textContent = '\u203A';
                chev.title = 'Marked or total amount';
                chev.onclick = (e) => { e.stopPropagation(); openAmountModePopover(e.currentTarget, path); };
                row.appendChild(chev);
                row.onclick = () => rowTap(path, node, path);          // open the list
            } else if (!detail) {
                row.classList.add('folder');                           // product on the home tree
                row.onclick = () => rowTap(path, node, path.slice(0, -1));
            } else {
                row.onclick = () => rowTap(path, node, null);          // product on its own list page
            }

            const dots = document.createElement('button');
            dots.className = 'dot-btn'; dots.textContent = '\u22EE';
            dots.onclick = (e) => { e.stopPropagation(); openNodeMenu(path, e.currentTarget); };
            row.appendChild(dots);

            box.appendChild(row);
        }

        // On a list page, show deeper sub-lists (lists only) indented beneath their parent — like the home outline.
        function renderSubOutline(box, parent, parentPath, depth) {
            (parent.children || []).forEach((n, idx) => {
                if (n.type !== 'list') return;
                if (n.hidden && !showHidden) return;
                const path = parentPath.concat(n.id);
                makeRow(box, n, path, idx, { detail: false, depth: depth });
                renderSubOutline(box, n, path, depth + 1);
            });
        }

        /* ---------- Smooth reorder: custom long-press drag (touch + mouse) ---------- */
        function attachDrag(row) {
            row.addEventListener('touchstart', onTouchStart, { passive: true });
            row.addEventListener('touchmove', onTouchMove, { passive: false });
            row.addEventListener('touchend', onTouchEnd);
            row.addEventListener('touchcancel', onTouchEnd);
            row.addEventListener('mousedown', onMouseDown);
        }

        function fromControls(target) {
            return target.closest('.dot-btn') || target.closest('.chevron')
                || (target.classList && target.classList.contains('checkbox'));
        }

        function beginPress(row, x, y, isTouch) {
            if (dnd) cleanupDrag();
            dnd = {
                row: row, draggedId: row.dataset.id, parentPath: JSON.parse(row.dataset.parent),
                startX: x, startY: y, lastY: y, active: false, isTouch: isTouch, timer: null, moved: false
            };
            if (isTouch) dnd.timer = setTimeout(activateDrag, 240);   // long-press to lift / select
            else dnd.holdTimer = setTimeout(() => longPressSelect(row, true), 480);  // mouse long-press selects
        }

        // Measured fresh on every frame, because the list scrolls while dragging.
        function dragSiblings() {
            const row = dnd.row;
            return [...dnd.box.querySelectorAll('.row')]
                .filter(r => r.dataset.parent === row.dataset.parent && r !== row)
                .map(el => ({ el, rect: el.getBoundingClientRect() }))
                .sort((a, b) => a.rect.top - b.rect.top);
        }

        function activateDrag() {
            if (!dnd || dnd.active) return;
            dnd.active = true;
            const row = dnd.row;
            dnd.box = row.parentElement;
            dnd.box.style.position = 'relative';
            dnd.startScroll = dnd.box.scrollTop;
            dnd.others = dragSiblings();
            row.classList.add('dragging');
            row.style.transition = 'none';
            row.style.position = 'relative';
            row.style.zIndex = '1000';
            dnd.indicator = document.createElement('div');
            dnd.indicator.className = 'drop-indicator';
            dnd.box.appendChild(dnd.indicator);
            if (draggingGroup()) {                     // show the rest of the selection travelling along
                dnd.mates = [...dnd.box.querySelectorAll('.row')]
                    .filter(r => r !== row && sel.ids.includes(r.dataset.id));
                dnd.mates.forEach(r => r.classList.add('drag-mate'));
            }
            if (navigator.vibrate) { try { navigator.vibrate(15); } catch (_) {} }
            dnd.raf = requestAnimationFrame(autoScrollStep);
        }

        function moveDrag(x, y) {
            dnd.lastY = y;
            paintDrag();
        }

        // Position the floating row and the drop indicator from the current pointer + scroll.
        function paintDrag() {
            if (!dnd || !dnd.active) return;
            const box = dnd.box, y = dnd.lastY;
            const scrolled = box.scrollTop - dnd.startScroll;
            dnd.row.style.transform = 'translateY(' + ((y - dnd.startY) + scrolled) + 'px)';
            dnd.others = dragSiblings();
            const boxRect = box.getBoundingClientRect();
            let topY = null, placed = false;
            for (const o of dnd.others) {
                const mid = o.rect.top + o.rect.height / 2;
                if (y < mid) { topY = o.rect.top; placed = true; break; }
            }
            if (!placed && dnd.others.length) topY = dnd.others[dnd.others.length - 1].rect.bottom;
            if (topY !== null) {
                dnd.indicator.style.display = 'block';
                dnd.indicator.style.top = (topY - boxRect.top + box.scrollTop - 4) + 'px';
            } else {
                dnd.indicator.style.display = 'none';
            }
        }

        /* Hold the item near the top or bottom edge and the list keeps scrolling,
           so it can be dropped past the rows that were on screen when the drag began. */
        function autoScrollStep() {
            if (!dnd || !dnd.active) return;
            const box = dnd.box;
            const r = box.getBoundingClientRect();
            const EDGE = 64, MAX = 18;
            let v = 0;
            if (dnd.lastY < r.top + EDGE)         v = -MAX * Math.min(1, (r.top + EDGE - dnd.lastY) / EDGE);
            else if (dnd.lastY > r.bottom - EDGE) v =  MAX * Math.min(1, (dnd.lastY - (r.bottom - EDGE)) / EDGE);
            if (v !== 0) {
                const limit = box.scrollHeight - box.clientHeight;
                const next = Math.max(0, Math.min(limit, box.scrollTop + v));
                if (next !== box.scrollTop) { box.scrollTop = next; paintDrag(); }
            }
            dnd.raf = requestAnimationFrame(autoScrollStep);
        }

        // true when the pressed row belongs to a multi-selection in this same parent
        function draggingGroup() {
            return !!sel && sel.ids.length > 1 && sel.ids.includes(dnd.draggedId)
                && sel.parentKey === JSON.stringify(dnd.parentPath);
        }

        function commitDrag() {
            const y = dnd.lastY;
            if (dnd.box) dnd.others = dragSiblings();   // rects may have moved under auto-scroll
            const parent = getNodeByPath(dnd.parentPath);
            if (!parent) return;
            const arr = parent.children;

            // a selection travels as one block, in its existing order
            const group = draggingGroup();
            const movingIds = group ? arr.filter(c => sel.ids.includes(c.id)).map(c => c.id) : [dnd.draggedId];

            // the drop reference can only be a row that is not itself moving
            const refs = dnd.others.filter(o => !movingIds.includes(o.el.dataset.id));
            let refId = null, before = true;
            for (const o of refs) {
                const mid = o.rect.top + o.rect.height / 2;
                if (y < mid) { refId = o.el.dataset.id; before = true; break; }
            }
            if (refId === null && refs.length) { refId = refs[refs.length - 1].el.dataset.id; before = false; }
            if (refId === null) return;

            const moved = [];
            const rest = arr.filter(c => {
                if (movingIds.includes(c.id)) { moved.push(c); return false; }
                return true;
            });
            if (!moved.length) return;
            let refI = rest.findIndex(c => c.id === refId);
            if (refI < 0) return;
            if (!before) refI += 1;
            rest.splice(refI, 0, ...moved);
            parent.children = rest;
            saveTree();
        }

        function cleanupDrag() {
            if (!dnd) return;
            if (dnd.timer) clearTimeout(dnd.timer);
            if (dnd.holdTimer) clearTimeout(dnd.holdTimer);
            if (dnd.raf) cancelAnimationFrame(dnd.raf);
            if (dnd.row) {
                dnd.row.classList.remove('dragging');
                dnd.row.style.transform = '';
                dnd.row.style.zIndex = '';
                dnd.row.style.transition = '';
                dnd.row.style.position = '';
            }
            if (dnd.mates) dnd.mates.forEach(r => r.classList.remove('drag-mate'));
            if (dnd.indicator && dnd.indicator.parentElement) dnd.indicator.parentElement.removeChild(dnd.indicator);
            dnd = null;
        }

        function onTouchStart(e) {
            if (e.touches.length !== 1 || fromControls(e.target)) return;
            const t = e.touches[0];
            beginPress(this, t.clientX, t.clientY, true);
        }
        function onTouchMove(e) {
            if (!dnd) return;
            const t = e.touches[0];
            if (!dnd.active) {
                if (Math.abs(t.clientX - dnd.startX) > 8 || Math.abs(t.clientY - dnd.startY) > 8) {
                    clearTimeout(dnd.timer); dnd = null;   // moved before hold => let it scroll
                }
                return;
            }
            if (Math.abs(t.clientY - dnd.startY) > 8) dnd.moved = true;
            e.preventDefault();                            // dragging => block scroll
            moveDrag(t.clientX, t.clientY);
        }
        function onTouchEnd(e) {
            if (!dnd) return;
            const wasActive = dnd.active;
            const movedRow = dnd.row, didMove = dnd.moved;
            if (wasActive) {
                e.preventDefault();
                if (didMove) commitDrag();                 // held and dragged => reorder
            }
            cleanupDrag();
            if (wasActive && !didMove) longPressSelect(movedRow, false);   // held in place => select
            else if (wasActive) render();
        }

        function onMouseDown(e) {
            if (e.button !== 0 || fromControls(e.target)) return;
            beginPress(this, e.clientX, e.clientY, false);
            window.addEventListener('mousemove', onMouseMove);
            window.addEventListener('mouseup', onMouseUp);
        }
        function onMouseMove(e) {
            if (!dnd) return;
            if (!dnd.active) {
                if (Math.abs(e.clientX - dnd.startX) > 4 || Math.abs(e.clientY - dnd.startY) > 4) {
                    if (dnd.holdTimer) clearTimeout(dnd.holdTimer);
                    activateDrag();
                } else return;
            }
            dnd.moved = true;
            e.preventDefault();
            moveDrag(e.clientX, e.clientY);
        }
        function onMouseUp() {
            window.removeEventListener('mousemove', onMouseMove);
            window.removeEventListener('mouseup', onMouseUp);
            if (!dnd) return;
            const wasActive = dnd.active;
            if (wasActive) commitDrag();
            cleanupDrag();
            if (wasActive) render();
        }

        function toggleCheck(path) {
            const node = getNodeByPath(path);
            node.checked = !node.checked;
            saveTree();
            render();
        }

        /* ---------- Add product / sub-list ---------- */
        function clearProductForm() {
            acc = null; pendingOp = null;
            pendingDate = null;
            const t = document.getElementById('expenseTitle');
            const a = document.getElementById('expenseAmount');
            if (t) t.value = '';

        const OP_SYMBOL = { '+': '+', '-': '\u2212', '*': '\u00D7', '/': '\u00F7' };
        function computeOp(x, op, y) {
            switch (op) {
                case '+': return x + y;
                case '-': return x - y;
                case '*': return x * y;
                case '/': return y === 0 ? NaN : x / y;
                default:  return y;
            }
        }

        function toggleOpMenu(e) { e.stopPropagation(); document.getElementById('opMenu').classList.toggle('open'); }
        function closeOpMenu() { const m = document.getElementById('opMenu'); if (m) m.classList.remove('open'); }

        // Pick an operator: bank the current number with the previous operator, then wait for the next number.
        async function applyOp(op) {
            const a = document.getElementById('expenseAmount');
            const v = parseFloat(a.value.trim());
            if (acc === null) {
                acc = isNaN(v) ? 0 : v;
            } else if (!isNaN(v)) {
                const r = computeOp(acc, pendingOp, v);
                if (!isFinite(r)) { closeOpMenu(); await customAlert('Cannot divide by zero.'); return; }
                acc = r;
            }
            pendingOp = op;
            a.value = '';
            a.placeholder = formatAmount(acc) + ' ' + OP_SYMBOL[op];
            closeOpMenu();
            a.focus();
        }

        document.addEventListener('click', (e) => {

        async function addProduct() {
            const node = getNodeByPath(currentPath);
            if (!node) return;
            const titleEl = document.getElementById('expenseTitle');
            const amountEl = document.getElementById('expenseAmount');
            const title = titleEl.value.trim();
            const typedRaw = amountEl.value.trim();
            const v = typedRaw === '' ? NaN : parseFloat(typedRaw);

            let amount;
            if (acc === null) {
                amount = isNaN(v) ? 0 : v;                            // blank price saves as 0
            } else {
                amount = isNaN(v) ? acc : computeOp(acc, pendingOp, v); // finish the pending operation
            }

            if (!title) { await customAlert('Please enter an item name.'); return; }
            if (isNaN(amount) || !isFinite(amount) || amount < 0) {
                await customAlert('Please enter a valid price.');
                return;
            }
            // the date is optional: without one the item is simply added without a badge
            node.children.unshift({
                id: uid(), name: title, type: 'product', amount,
                date: pendingDate || null, checked: false, children: []
            });
            saveTree();
            clearProductForm();

        function escapeCSV(val) {
            val = String(val);
            return /[",\n]/.test(val) ? '"' + val.replace(/"/g, '""') + '"' : val;
        }
        function parseCSVLine(line) {
            const out = []; let cur = '', q = false;
            for (let i = 0; i < line.length; i++) {
                const ch = line[i];
                if (q) {
                    if (ch === '"') { if (line[i + 1] === '"') { cur += '"'; i++; } else q = false; }
                    else cur += ch;
                } else {
                    if (ch === '"') q = true;
                    else if (ch === ',') { out.push(cur); cur = ''; }
                    else cur += ch;
                }
            }
            out.push(cur);
            return out;
        }

        async function exportCSV() {
            closeHomeMenu();
            if (tree.children.length === 0) { await customAlert('There are no lists to export.'); return; }
            const rows = ['Level1,Level2,Level3,Level4,Type,Amount,Checked,Hidden,Date,AmountMode'];
            (function walk(node, names) {
                (node.children || []).forEach(child => {
                    const path = names.concat(child.name);
                    const cols = ['', '', '', ''];
                    for (let i = 0; i < path.length && i < 4; i++) cols[i] = escapeCSV(path[i]);
                    cols.push(child.type);
                    cols.push(child.type === 'product' ? (child.amount || 0) : '');
                    cols.push(child.checked ? '1' : '0');
                    cols.push(child.hidden ? '1' : '0');
                    cols.push(child.type === 'product' ? (child.date || '') : '');
                    cols.push(child.type === 'list' ? amountMode(child) : '');
                    rows.push(cols.join(','));
                    if (child.type === 'list') walk(child, path);
                });
            })(tree, []);

            const blob = new Blob([rows.join('\n')], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = 'spendz_' + fileStamp(new Date()) + '.csv';
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function triggerImport() {

        async function handleImportFile(event) {
            const file = event.target.files[0];
            if (!file) return;
            const text = await file.text();
            event.target.value = '';

            const lines = text.split(/\r?\n/).filter(l => l.trim() !== '');
            if (lines.length === 0) { await customAlert('That file is empty.'); return; }

            let start = 0;
            const header = parseCSVLine(lines[0]).map(h => h.trim().toLowerCase());
            if (header[0] === 'level1') start = 1;

            // parse into {names[], type, amount, checked}, sorted shallow-first
            const parsed = [];
            for (let i = start; i < lines.length; i++) {
                const c = parseCSVLine(lines[i]);
                const names = [c[0], c[1], c[2], c[3]].map(x => (x || '').trim()).filter(x => x !== '');
                if (names.length === 0) continue;
                const type = (c[4] || '').trim().toLowerCase() === 'product' ? 'product' : 'list';
                const amount = parseFloat(c[5]);
                const flag = (c[6] || '').trim().toLowerCase();
                const hflag = (c[7] || '').trim().toLowerCase();
                const dstr = (c[8] || '').trim();
                const mstr = (c[9] || '').trim().toLowerCase();
                parsed.push({
                    names, type,
                    amount: isNaN(amount) ? 0 : amount,
                    checked: flag === '1' || flag === 'true' || flag === 'yes',
                    hidden: hflag === '1' || hflag === 'true' || hflag === 'yes',
                    date: /^\d{4}-\d{2}-\d{2}$/.test(dstr) ? dstr : null,
                    amountMode: mstr === 'marked' ? 'marked' : 'total'
                });
            }
            if (parsed.length === 0) { await customAlert('No valid rows were found.'); return; }
            parsed.sort((a, b) => a.names.length - b.names.length);

            const ok = await customConfirm(
                'Import ' + parsed.length + ' item(s)? Matching names are updated and new ones are added; your other data stays.',
                'Import CSV'
            );
            if (!ok) return;

            parsed.forEach(r => {
                let node = tree;
                for (let i = 0; i < r.names.length; i++) {
                    const last = i === r.names.length - 1;
                    let child = node.children.find(c => c.name === r.names[i]);
                    if (!child) {
                        child = last
                            ? { id: uid(), name: r.names[i], type: r.type, amount: r.type === 'product' ? r.amount : 0, checked: r.checked, hidden: r.type === 'list' ? r.hidden : false, date: r.type === 'product' ? r.date : null, amountMode: r.type === 'list' ? r.amountMode : 'total', children: [] }
                            : { id: uid(), name: r.names[i], type: 'list', amount: 0, checked: false, hidden: false, amountMode: 'total', children: [] };
                        node.children.push(child);
                    } else if (last) {
                        child.type = r.type;
                        if (r.type === 'product') { child.amount = r.amount; child.checked = r.checked; child.date = r.date; }
                        else { child.hidden = r.hidden; child.amountMode = r.amountMode; }
                    }
                    node = child;
                }
            });
            saveTree();
            go([]);
            await customAlert('Import complete.');
        }

        /* ============================================================
           DATES  (AllDates/01jan.png \u2026 31dec.png)
           ============================================================ */
        const MON3 = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
        const MONTH_NAMES = ['January','February','March','April','May','June',
                             'July','August','September','October','November','December'];
        const DOW = ['S','M','T','W','T','F','S'];

        function pad2(n) { return String(n).padStart(2, '0'); }
        function dateKey(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
        function parseKey(k) { const p = String(k).split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
        function dateImageFile(k) { const d = parseKey(k); return pad2(d.getDate()) + MON3[d.getMonth()] + '.png'; }
        function monTitle(m) { return MON3[m].charAt(0).toUpperCase() + MON3[m].slice(1); }
        function dateLabel(k) {
            const d = parseKey(k);
            return pad2(d.getDate()) + '-' + monTitle(d.getMonth()) + '-' + String(d.getFullYear()).slice(2);
        }
        // export file name: spendz_09-Aug-26
        function fileStamp(d) {
            return pad2(d.getDate()) + '-' + monTitle(d.getMonth()) + '-' + String(d.getFullYear()).slice(2);
        }

        // The calendar button shows the chosen day's image, or a plain calendar glyph.
        function updateDateButton() {
            const btn = document.getElementById('calBtn');

            btn.classList.add('has-date');
            btn.title = dateLabel(pendingDate) + ' \u2014 tap to change';
            const img = document.createElement('img');
            img.src = 'AllDates/' + dateImageFile(pendingDate);
            img.alt = dateLabel(pendingDate);
            img.onerror = () => { btn.textContent = pad2(parseKey(pendingDate).getDate()); };
            btn.appendChild(img);
        }

        function renderCalendar() {

        /* ============================================================
           MULTI-SELECT (records in one group, lists/sub-lists in another)
           ============================================================ */
        function parentKeyOf(path) { return JSON.stringify(path.slice(0, -1)); }
        function isSelected(id, path) {
            return !!sel && sel.ids.includes(id) && sel.parentKey === parentKeyOf(path);
        }

        // Long-press starts a selection; further taps add or remove rows.
        function longPressSelect(row, fromMouse) {
            cleanupDrag();                                   // a press that selects never also drags
            if (!row || !row.dataset) { render(); return; }
            const path = JSON.parse(row.dataset.parent).concat(row.dataset.id);
            const node = getNodeByPath(path);
            if (!node) { render(); return; }
            if (fromMouse) {                                 // swallow the click this press will fire
                suppressTap = true;
                setTimeout(() => { suppressTap = false; }, 300);
            }
            if (!sel) {
                sel = { kind: node.type, parentKey: parentKeyOf(path), ids: [node.id] };
                if (navigator.vibrate) { try { navigator.vibrate(12); } catch (_) {} }
            } else {
                toggleSelect(path, node);
                return;
            }
            render();
        }

        function toggleSelect(path, node) {
            if (!sel) return;
            // one group at a time: same kind, same parent — keeps move up/down meaningful
            if (node.type !== sel.kind || parentKeyOf(path) !== sel.parentKey) return;
            const i = sel.ids.indexOf(node.id);
            if (i > -1) sel.ids.splice(i, 1); else sel.ids.push(node.id);
            if (sel.ids.length === 0) sel = null;
            render();
        }

        function clearSelection() { sel = null; render(); }

        // Every row tap goes through here, so selection mode can take over the tap.
        function rowTap(path, node, navPath) {
            if (suppressTap) { suppressTap = false; return; }
            if (sel) { toggleSelect(path, node); return; }
            if (navPath) go(navPath);
        }

        function selectedNodes() {
            if (!sel) return [];
            const parent = getNodeByPath(JSON.parse(sel.parentKey));
            if (!parent) return [];
            return (parent.children || []).filter(c => sel.ids.includes(c.id));
        }

        // keeps a stale selection from lingering after its rows are gone
        function pruneSelection() {
            if (!sel) return;
            if (selectedNodes().length === 0) sel = null;
        }

        async function deleteSelected() {
            const nodes = selectedNodes();
            const what = nodes.length === 1
                ? (sel.kind === 'product' ? 'this item' : '"' + nodes[0].name + '" and everything inside it')
                : nodes.length + (sel.kind === 'product' ? ' items' : ' lists and everything inside them');
            const ok = await customConfirm('Delete ' + what + '?', 'Delete', true);
            if (!ok) return;
            const parent = getNodeByPath(JSON.parse(sel.parentKey));
            parent.children = parent.children.filter(c => !sel.ids.includes(c.id));
            sel = null;
            saveTree();
            render();
        }

        function hideSelected() {
            const nodes = selectedNodes();
            const allHidden = nodes.every(n => n.hidden);
            nodes.forEach(n => { n.hidden = !allHidden; if (n.hidden) n.checked = false; });
            sel = null;
            saveTree();
            render();
        }

        function openMovePickerForSelection() {
            const nodes = selectedNodes();
            if (!nodes.length) return;
            const srcPath = JSON.parse(sel.parentKey);
            const srcParentId = srcPath.length ? srcPath[srcPath.length - 1] : null;
            const dests = [];
            if (sel.kind === 'list') dests.push({ path: [], name: 'Home (top level)', depth: -1, home: true });
            collectDestLists(tree, [], dests, sel.ids);      // never into one of the moved lists

            dlgBox.innerHTML = '';
            const h = document.createElement('h3');
            h.textContent = 'Move ' + nodes.length + ' ' + (sel.kind === 'product' ? 'item' : 'list')
                          + (nodes.length > 1 ? 's' : '') + ' to:';
            dlgBox.appendChild(h);

            const listDiv = document.createElement('div'); listDiv.className = 'move-list';
            let count = 0;
            dests.forEach(d => {
                const curParent = d.home ? (srcParentId === null) : (d.path[d.path.length - 1] === srcParentId);
                if (curParent) return;
                count++;
                const b = document.createElement('button');
                b.style.paddingLeft = (12 + Math.max(0, d.depth) * 16) + 'px';
                const ic = document.createElement('span'); ic.className = 'mv-icon';
                ic.textContent = d.home ? '\u2302' : '\u2022';
                b.appendChild(ic);
                const tx = document.createElement('span'); tx.textContent = d.name; b.appendChild(tx);
                b.onclick = () => { moveSelectedTo(d.path); closeDialog(); };
                listDiv.appendChild(b);
            });
            if (count === 0) {
                const p = document.createElement('p');
                p.style.color = '#888'; p.style.margin = '6px 0 14px'; p.style.fontSize = '.9em';
                p.textContent = 'No other list to move into. Create another list first.';
                dlgBox.appendChild(p);
            } else {
                dlgBox.appendChild(listDiv);
            }

            const btns = document.createElement('div'); btns.className = 'dialog-buttons';
            const cancel = document.createElement('button');
            cancel.className = 'btn-cancel'; cancel.textContent = 'Cancel';
            cancel.onclick = closeDialog;
            btns.appendChild(cancel);
            dlgBox.appendChild(btns);
            dlgOverlay.classList.add('open');
        }

        function moveSelectedTo(destPath) {
            const parent = getNodeByPath(JSON.parse(sel.parentKey));
            const dest = getNodeByPath(destPath);
            if (!parent || !dest) return;
            const moved = [];
            parent.children = parent.children.filter(c => {
                if (sel.ids.includes(c.id)) { moved.push(c); return false; }
                return true;
            });
            for (let i = moved.length - 1; i >= 0; i--) dest.children.unshift(moved[i]);   // keep their order
            sel = null;
            saveTree();
            render();
        }

        /* ============================================================
           THEMES
           ============================================================ */
        const THEMES = [['brown', 'Brown'], ['green', 'Green'], ['dark', 'Dark']];

        function applyTheme(name) {
            const valid = THEMES.some(t => t[0] === name) ? name : 'brown';
            document.documentElement.setAttribute('data-theme', valid);
            localStorage.setItem('spendzTheme', valid);
        }
        function currentTheme() { return document.documentElement.getAttribute('data-theme') || 'brown'; }

        function openThemeMenu() {
            closeHomeMenu();
            const cur = currentTheme();
            const anchor = document.querySelector('.home-header .menu-btn');
            openPopMenu(anchor, 'Theme', THEMES.map(t => ({
                label: t[1], tick: cur === t[0], onClick: () => applyTheme(t[0])
            })), 'theme');
        }

        /* ============================================================
           Custom dialogs (alert / confirm / prompt)
           ============================================================ */
        function customAlert(message, title) {
            title = title || 'Notice';
            return new Promise(resolve => {
                dlgBox.innerHTML =
                    '<h3></h3><p></p><div class="dialog-buttons"><button class="btn-ok" id="dlgOk">OK</button></div>';
                dlgBox.querySelector('h3').textContent = title;
                dlgBox.querySelector('p').textContent = message;
                dlgOverlay.classList.add('open');
                dlgBox.querySelector('#dlgOk').onclick = () => { closeDialog(); resolve(); };
            });
        }
        function customConfirm(message, title, danger) {
            title = title || 'Confirm';
            return new Promise(resolve => {
                dlgBox.innerHTML =
                    '<h3></h3><p></p><div class="dialog-buttons">' +
                    '<button class="btn-cancel" id="dlgCancel">Cancel</button>' +
                    '<button class="' + (danger ? 'btn-danger' : 'btn-ok') + '" id="dlgOk">Yes</button></div>';
                dlgBox.querySelector('h3').textContent = title;
                dlgBox.querySelector('p').textContent = message;
                dlgOverlay.classList.add('open');
                dlgBox.querySelector('#dlgCancel').onclick = () => { closeDialog(); resolve(false); };
                dlgBox.querySelector('#dlgOk').onclick = () => { closeDialog(); resolve(true); };
            });
        }
        function customPrompt(message, title, value) {
            title = title || 'Enter'; value = value || '';
            return new Promise(resolve => {
                dlgBox.innerHTML =
                    '<h3></h3><p></p><input type="text" id="dlgInput" /><div class="dialog-buttons">' +
                    '<button class="btn-cancel" id="dlgCancel">Cancel</button>' +
                    '<button class="btn-ok" id="dlgOk">Save</button></div>';
                dlgBox.querySelector('h3').textContent = title;
                dlgBox.querySelector('p').textContent = message;
                const input = dlgBox.querySelector('#dlgInput');
                input.value = value;
                dlgOverlay.classList.add('open');
                setTimeout(() => input.focus(), 200);
                const done = v => { closeDialog(); resolve(v); };
                dlgBox.querySelector('#dlgCancel').onclick = () => done(null);
                dlgBox.querySelector('#dlgOk').onclick = () => done(input.value);
                input.onkeydown = e => { if (e.key === 'Enter') done(input.value); };
            });
        }
    </script>
</body>
</html>
